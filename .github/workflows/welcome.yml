name: Post Welcome Message
on:
    pull_request:
        types: [opened]
permissions:
    pull-requests: write
jobs:
    welcome:
        name: Post welcome comment
        runs-on: ubuntu-latest
        steps:
            - run: gh pr comment "$PR_URL" --body "Welcome to the repository! Thank you for your contribution."
              env:
                GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
                PR_URL: ${{github.event.pull_request.html_url}}